# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
  port: 8888
  context-path: /meetroom
  error:
    whitelabel:
      enabled: false

spring:
  jmx:
    default-domain: project-server
  # 环境 dev|test|pro
  profiles:
    active: dev
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
  # jackson时间格式化
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
      enabled: true
  # 指定静态资源的路径
  mvc:
    # URL响应地址（Springboot默认为/**)
    static-path-pattern: /pic/**
  web:
    resources:
      static-locations: classpath:/static/,file:${upload.path}

#服务器地址 不带斜杠结尾
serverUrl: http://localhost:8888

isDemo: false

# jwt配置
jwt:
  # 加密秘钥（由环境变量注入，勿硬编码）
  secret: ${JWT_SECRET:}
  # token有效时长 单位秒 7天604800
  adminExpire: 86400
  custExpire: 604800
  workExpire: 604800


# AI 助手配置（密钥由环境变量注入，勿硬编码）
ai:
  enabled: ${AI_ENABLED:false}
  api-key: ${AI_API_KEY:}
  base-url: ${AI_BASE_URL:https://maas.qianwenaiapi.com/compatible-mode/v1}
  model: ${AI_MODEL:qwen-plus}


# 文件上传
upload:
  path: c:\file
  # 文件服务器的图片子目录 （斜杠结尾）
  server: ${serverUrl}/pic


